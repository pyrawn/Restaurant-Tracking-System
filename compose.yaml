services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python -m app.web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant}:${POSTGRES_PASSWORD:-restaurant_dev}@db:5432/${POSTGRES_DB:-restaurant_tracker}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  worker:
    build: .
    command: python -m app.worker
    environment:
      INPUT_DIR: /app/data/inbox
      PROCESSED_DIR: /app/data/processed
      FRAME_INTERVAL_SECONDS: ${FRAME_INTERVAL_SECONDS:-30}
      MODEL_PATH: ${MODEL_PATH:-/app/models/yolov8s.pt}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.25}
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant}:${POSTGRES_PASSWORD:-restaurant_dev}@db:5432/${POSTGRES_DB:-restaurant_tracker}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  live:
    build: .
    command: python -m app.live_worker
    environment:
      LIVE_STREAM_URL: ${LIVE_STREAM_URL:?set LIVE_STREAM_URL to the YouTube video/live URL}
      LIVE_MODE: ${LIVE_MODE:-loop}
      LIVE_FRAME_COUNT: ${LIVE_FRAME_COUNT:-1}
      LIVE_CAPTURE_INTERVAL_SECONDS: ${LIVE_CAPTURE_INTERVAL_SECONDS:-30}
      LIVE_POLL_INTERVAL_SECONDS: ${LIVE_POLL_INTERVAL_SECONDS:-30}
      INPUT_DIR: /app/data/inbox
      PROCESSED_DIR: /app/data/processed
      MODEL_PATH: ${MODEL_PATH:-/app/models/yolov8s.pt}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.25}
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant}:${POSTGRES_PASSWORD:-restaurant_dev}@db:5432/${POSTGRES_DB:-restaurant_tracker}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
